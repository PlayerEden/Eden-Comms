name: Eden Comms - installable offline Preview APK

# Sector Rebound / Operation Phosphor style: repeatable PUBLIC test signer
# confined to an independent com.edenpractical.comms.preview package.
# One initial run when this file lands; thereafter manual to conserve Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-preview-apk.yml'

permissions:
  contents: read

concurrency:
  group: eden-comms-offline-preview
  cancel-in-progress: false

jobs:
  build-preview:
    name: Build pinned public-test-signed debug preview
    if: github.repository == 'PlayerEden/Eden-Comms' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require fresh unique build number and exact main checkout
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || { echo 'Start a NEW preview run for a new version'; exit 1; }
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          code=$((200000 + GITHUB_RUN_NUMBER))
          (( code > 200000 && code <= 999999999 )) || exit 1
          echo "EDEN_PREVIEW_CODE=$code" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 37 and Build Tools 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Retrieve and verify public AOSP development signer (never for release)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/eden-public-preview"
          base='https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security'
          for name in testkey.pk8 testkey.x509.pem; do
            curl --fail --show-error --silent --location --retry 3 "$base/$name?format=TEXT" |
              base64 --decode > "$RUNNER_TEMP/eden-public-preview/$name"
            test -s "$RUNNER_TEMP/eden-public-preview/$name"
          done
          [[ "$(git hash-object "$RUNNER_TEMP/eden-public-preview/testkey.pk8")" == '586c1bd5cf96f9358f36b37ea98fef93f4d0a8e3' ]] || exit 1
          [[ "$(git hash-object "$RUNNER_TEMP/eden-public-preview/testkey.x509.pem")" == 'e242d83e2bf72169ab0abd5280d4d455caef71eb' ]] || exit 1
          openssl pkcs8 -inform DER -nocrypt -in "$RUNNER_TEMP/eden-public-preview/testkey.pk8"             -out "$RUNNER_TEMP/eden-public-preview/testkey.key.pem"
          openssl pkcs12 -export             -inkey "$RUNNER_TEMP/eden-public-preview/testkey.key.pem"             -in "$RUNNER_TEMP/eden-public-preview/testkey.x509.pem"             -out "$RUNNER_TEMP/eden-public-preview/public-testkey.p12"             -name aosp-public-testkey -passout pass:public-eden-preview-only
          test -s "$RUNNER_TEMP/eden-public-preview/public-testkey.p12"

      - name: Run debug tests and assemble separate Preview package
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug             -PedenOfflinePreview=true             "-PedenOfflinePreviewVersionCode=$EDEN_PREVIEW_CODE"             "-PedenSourceRevision=$GITHUB_SHA"
          bash scripts/check_security_review_boundary.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Re-sign isolated preview using pinned public AOSP key
        run: |
          set -euo pipefail
          export EC_INTERNAL_KEYSTORE_BASE64
          EC_INTERNAL_KEYSTORE_BASE64="$(base64 -w0 "$RUNNER_TEMP/eden-public-preview/public-testkey.p12")"
          export EC_INTERNAL_KEYSTORE_PASSWORD=public-eden-preview-only
          export EC_INTERNAL_KEY_ALIAS=aosp-public-testkey
          export EC_INTERNAL_KEY_PASSWORD=public-eden-preview-only
          mkdir -p dist
          bash scripts/sign_internal_test_apk.sh             app/build/outputs/apk/debug/app-debug.apk             "dist/eden-comms-preview-$EDEN_PREVIEW_CODE.apk"
          unset EC_INTERNAL_KEYSTORE_BASE64 EC_INTERNAL_KEYSTORE_PASSWORD EC_INTERNAL_KEY_ALIAS EC_INTERNAL_KEY_PASSWORD

      - name: Verify APK package, public signer, exact source and version
        run: |
          set -euo pipefail
          apk="dist/eden-comms-preview-$EDEN_PREVIEW_CODE.apk"
          signer="$(openssl x509             -in "$RUNNER_TEMP/eden-public-preview/testkey.x509.pem"             -outform DER | sha256sum | awk '{print $1}')"
          [[ "$signer" =~ ^[0-9a-f]{64}$ ]] || exit 1
          python3 scripts/audit_apk_identity.py             --apk "$apk"             --output-dir dist/evidence             --offline-preview-version-code "$EDEN_PREVIEW_CODE"             --expected-signer-sha256 "$signer"
          bash scripts/check_preview_permissions.sh "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "### EDEN COMMS TEST-ONLY PREVIEW" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: com.edenpractical.comms.preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Version code: $EDEN_PREVIEW_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Public AOSP signer: $signer" >> "$GITHUB_STEP_SUMMARY"
          echo "Not a reviewed secure messenger. Not a Google Play signing identity." >> "$GITHUB_STEP_SUMMARY"
          echo "This APK updates only earlier *matching preview package + signer* installations." >> "$GITHUB_STEP_SUMMARY"

      - name: Include test quick start alongside APK
        run: |
          set -euo pipefail
          test -s docs/TEST_BUILD_QUICKSTART.md
          cp docs/TEST_BUILD_QUICKSTART.md dist/START-HERE-TEST.md
          {
            printf '\n---\n'
            printf 'Build versionCode: %s\n' "$EDEN_PREVIEW_CODE"
            printf 'Exact source revision: %s\n' "$GITHUB_SHA"
            printf 'Package: com.edenpractical.comms.preview\n'
          } >> dist/START-HERE-TEST.md
          echo "### This build: what to test" >> "$GITHUB_STEP_SUMMARY"
          echo "Open START-HERE-TEST.md in the downloaded artifact for one-phone" >> "$GITHUB_STEP_SUMMARY"
          echo "and two-phone LAN instructions. No production or security acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "F4 voice milestone: on two approved same-Wi-Fi phones, tap START TALKING" >> "$GITHUB_STEP_SUMMARY"
          echo "then SEND VOICE BURST. Maximum 3 seconds; record-then-send, NOT" >> "$GITHUB_STEP_SUMMARY"
          echo "continuous walkie-talkie streaming. Test with harmless speech only." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-comms-offline-preview-${{ env.EDEN_PREVIEW_CODE }}-${{ github.sha }}
          path: |
            dist/eden-comms-preview-*.apk
            dist/eden-comms-preview-*.apk.sha256
            dist/evidence/apk-identity.json
            dist/evidence/apk-identity.md
            dist/START-HERE-TEST.md
          if-no-files-found: error
          retention-days: 14

      - name: Remove public test key material from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/eden-public-preview"
