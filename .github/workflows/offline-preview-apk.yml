name: Eden Comms - installable offline Preview APK

# Sector Rebound / Operation Phosphor style: repeatable PUBLIC test signer
# confined to an independent com.edenpractical.comms.preview package.
# Reviewed workflow updates make an installable test checkpoint; otherwise
# runs are manual to conserve GitHub Actions minutes.
# F6-P checkpoint: consolidate previously merged F4-S non-blocking live
# microphone reads and F2-P terminal Bluetooth approval timeout into one
# installable field-test artifact with F4-Q speaker observations and prior fixes.
# This is a debug-only packaging checkpoint, NOT hardware/security acceptance.
# Same Preview package and pinned public AOSP test signer; debug-only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-preview-apk.yml'
      - 'scripts/emulator_visual_qa.py'

permissions:
  contents: read

concurrency:
  group: eden-comms-offline-preview
  cancel-in-progress: false

jobs:
  build-preview:
    name: Build pinned public-test-signed debug preview
    if: github.repository == 'PlayerEden/Eden-Comms' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require fresh unique build number and exact main checkout
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]] || { echo 'Start a NEW preview run for a new version'; exit 1; }
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          code=$((200000 + GITHUB_RUN_NUMBER))
          (( code > 200000 && code <= 999999999 )) || exit 1
          echo "EDEN_PREVIEW_CODE=$code" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 37 and Build Tools 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Retrieve and verify public AOSP development signer (never for release)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/eden-public-preview"
          base='https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security'
          for name in testkey.pk8 testkey.x509.pem; do
            curl --fail --show-error --silent --location --retry 3 "$base/$name?format=TEXT" |
              base64 --decode > "$RUNNER_TEMP/eden-public-preview/$name"
            test -s "$RUNNER_TEMP/eden-public-preview/$name"
          done
          [[ "$(git hash-object "$RUNNER_TEMP/eden-public-preview/testkey.pk8")" == '586c1bd5cf96f9358f36b37ea98fef93f4d0a8e3' ]] || exit 1
          [[ "$(git hash-object "$RUNNER_TEMP/eden-public-preview/testkey.x509.pem")" == 'e242d83e2bf72169ab0abd5280d4d455caef71eb' ]] || exit 1
          openssl pkcs8 -inform DER -nocrypt -in "$RUNNER_TEMP/eden-public-preview/testkey.pk8"             -out "$RUNNER_TEMP/eden-public-preview/testkey.key.pem"
          openssl pkcs12 -export             -inkey "$RUNNER_TEMP/eden-public-preview/testkey.key.pem"             -in "$RUNNER_TEMP/eden-public-preview/testkey.x509.pem"             -out "$RUNNER_TEMP/eden-public-preview/public-testkey.p12"             -name aosp-public-testkey -passout pass:public-eden-preview-only
          test -s "$RUNNER_TEMP/eden-public-preview/public-testkey.p12"

      - name: Run debug tests and assemble separate Preview package
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug             -PedenOfflinePreview=true             "-PedenOfflinePreviewVersionCode=$EDEN_PREVIEW_CODE"             "-PedenSourceRevision=$GITHUB_SHA"
          bash scripts/check_security_review_boundary.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Re-sign isolated preview using pinned public AOSP key
        run: |
          set -euo pipefail
          export EC_INTERNAL_KEYSTORE_BASE64
          EC_INTERNAL_KEYSTORE_BASE64="$(base64 -w0 "$RUNNER_TEMP/eden-public-preview/public-testkey.p12")"
          export EC_INTERNAL_KEYSTORE_PASSWORD=public-eden-preview-only
          export EC_INTERNAL_KEY_ALIAS=aosp-public-testkey
          export EC_INTERNAL_KEY_PASSWORD=public-eden-preview-only
          mkdir -p dist
          bash scripts/sign_internal_test_apk.sh             app/build/outputs/apk/debug/app-debug.apk             "dist/eden-comms-preview-$EDEN_PREVIEW_CODE.apk"
          unset EC_INTERNAL_KEYSTORE_BASE64 EC_INTERNAL_KEYSTORE_PASSWORD EC_INTERNAL_KEY_ALIAS EC_INTERNAL_KEY_PASSWORD

      - name: Verify APK package, public signer, exact source and version
        run: |
          set -euo pipefail
          apk="dist/eden-comms-preview-$EDEN_PREVIEW_CODE.apk"
          signer="$(openssl x509             -in "$RUNNER_TEMP/eden-public-preview/testkey.x509.pem"             -outform DER | sha256sum | awk '{print $1}')"
          [[ "$signer" =~ ^[0-9a-f]{64}$ ]] || exit 1
          python3 scripts/audit_apk_identity.py             --apk "$apk"             --output-dir dist/evidence             --offline-preview-version-code "$EDEN_PREVIEW_CODE"             --expected-signer-sha256 "$signer"
          bash scripts/check_preview_permissions.sh "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "### EDEN COMMS TEST-ONLY PREVIEW" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: com.edenpractical.comms.preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Version code: $EDEN_PREVIEW_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Public AOSP signer: $signer" >> "$GITHUB_STEP_SUMMARY"
          echo "Not a reviewed secure messenger. Not a Google Play signing identity." >> "$GITHUB_STEP_SUMMARY"
          echo "This APK updates only earlier *matching preview package + signer* installations." >> "$GITHUB_STEP_SUMMARY"

      - name: Include test quick start alongside APK
        run: |
          set -euo pipefail
          test -s docs/TEST_BUILD_QUICKSTART.md
          cp docs/TEST_BUILD_QUICKSTART.md dist/START-HERE-TEST.md
          {
            printf '\n---\n'
            printf 'Build versionCode: %s\n' "$EDEN_PREVIEW_CODE"
            printf 'Exact source revision: %s\n' "$GITHUB_SHA"
            printf 'Package: com.edenpractical.comms.preview\n'
          } >> dist/START-HERE-TEST.md
          echo "### This build: what to test" >> "$GITHUB_STEP_SUMMARY"
          echo "Open START-HERE-TEST.md in the downloaded artifact for one-phone" >> "$GITHUB_STEP_SUMMARY"
          echo "and two-phone LAN instructions. No production or security acceptance." >> "$GITHUB_STEP_SUMMARY"
          echo "F4-F LIVE PTT TEST: on both phones use fresh reciprocal QR codes" >> "$GITHUB_STEP_SUMMARY"
          echo "and two independent approvals/final confirmations on the same Wi-Fi." >> "$GITHUB_STEP_SUMMARY"
          echo "HOLD TO TALK now requests the host-granted floor before enabling the mic;" >> "$GITHUB_STEP_SUMMARY"
          echo "voice streams DURING a successful press, up to 3 seconds." >> "$GITHUB_STEP_SUMMARY"
          echo "The accessible TAP fallback still records then sends, with the same grant." >> "$GITHUB_STEP_SUMMARY"
          echo "Test simultaneous presses, canceled pending grants, and both directions." >> "$GITHUB_STEP_SUMMARY"
          echo "F4-H/J CHECK: while transmitting, other phone should get prompt BUSY/DENY;" >> "$GITHUB_STEP_SUMMARY"
          echo "Wi-Fi loss/End should stop local mic and speaker promptly, no auto-reconnect." >> "$GITHUB_STEP_SUMMARY"
          echo "F4-I CHECK: cancel or hide TAP recording before send; no late ghost burst." >> "$GITHUB_STEP_SUMMARY"
          echo "If recording sent before cancel, already sent audio cannot be recalled." >> "$GITHUB_STEP_SUMMARY"
          echo "F4-L CHECK: the joiner rapidly presses and cancels Talk 3–5 times." >> "$GITHUB_STEP_SUMMARY"
          echo "Delayed DENY/GRANT must not start canceled audio or drop a healthy session." >> "$GITHUB_STEP_SUMMARY"
          echo "F4-M is a virtual packet+voice scenario lab, NOT physical two-phone evidence." >> "$GITHUB_STEP_SUMMARY"
          echo "F4-O CHECK: release HOLD during speech; no new frames after stop." >> "$GITHUB_STEP_SUMMARY"
          echo "F4-O CHECK: Hide, End, background or Wi-Fi loss while receiving;" >> "$GITHUB_STEP_SUMMARY"
          echo "speaker buffer should drain/stop and no stale sound should resume." >> "$GITHUB_STEP_SUMMARY"
          echo "F4-Q CHECK: compare local AudioTrack speaker-start counts on B after A talks;" >> "$GITHUB_STEP_SUMMARY"
          echo "a completed encrypted turn is NOT proof that B heard speech." >> "$GITHUB_STEP_SUMMARY"
          echo "Check local playback-problem counts after muted or dropped receiver frames;" >> "$GITHUB_STEP_SUMMARY"
          echo "use Copy this phone's test summary on each phone, never record speech." >> "$GITHUB_STEP_SUMMARY"
          echo "F4-S LIVE MIC CHECK: hold/release while speaking, Wi-Fi loss, Hide/End;" >> "$GITHUB_STEP_SUMMARY"
          echo "verify promptly stopped microphone indicator and no stale audio." >> "$GITHUB_STEP_SUMMARY"
          echo "A nonblocking 450 ms microphone stall cutoff may clip on some OEMs;" >> "$GITHUB_STEP_SUMMARY"
          echo "compare actual audible speech A to B and B to A, not just UI counts." >> "$GITHUB_STEP_SUMMARY"
          echo "INTEGRATED TEST BUILD: Home -> Connect Nearby -> Same Wi-Fi / Bluetooth /" >> "$GITHUB_STEP_SUMMARY"
          echo "Wi-Fi Direct -> fresh QR + mutual approval -> actual Text / Talk -> Disconnect." >> "$GITHUB_STEP_SUMMARY"
          echo "All three debug paths use real approved TLS text/ACK and short foreground voice." >> "$GITHUB_STEP_SUMMARY"
          echo "No phone-to-phone device acceptance or independent security review yet." >> "$GITHUB_STEP_SUMMARY"
          echo "Never use public-test-signed builds for sensitive or emergency messages." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-comms-offline-preview-${{ env.EDEN_PREVIEW_CODE }}-${{ github.sha }}
          path: |
            dist/eden-comms-preview-*.apk
            dist/eden-comms-preview-*.apk.sha256
            dist/evidence/apk-identity.json
            dist/evidence/apk-identity.md
            dist/START-HERE-TEST.md
          if-no-files-found: error
          retention-days: 3

      - name: Remove public test key material from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/eden-public-preview"

  integrated-visual:
    name: Inspect actual installable Preview UI on Android emulator
    needs: build-preview
    if: github.repository == 'PlayerEden/Eden-Comms' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the SAME final installable Preview APK
        uses: actions/download-artifact@v4
        with:
          pattern: eden-comms-offline-preview-*-${{ github.sha }}
          path: visual-preview
          merge-multiple: true
      - name: Enable hardware accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture real Home, method chooser, LAN idle, Help, Settings, privacy and accessible layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          # Emulator runner invokes each script line in a separate shell.
          # Resolve the artifact path in ONE command; do not carry a
          # shell variable from a previous line (initial run failed there).
          script: python3 scripts/emulator_visual_qa.py --apk "$(find visual-preview -maxdepth 1 -type f -name 'eden-comms-preview-*.apk' -print -quit)" --package com.edenpractical.comms.preview --out qa-results/integrated-preview
      - name: Publish real emulator screenshot evidence (never live peer data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eden-comms-integrated-visual-${{ github.sha }}
          path: |
            qa-results/integrated-preview/*.png
            qa-results/integrated-preview/summary.json
          if-no-files-found: warn
          retention-days: 2
