name: Android debug checks
on:
  push:
    branches:
      - main
      - planning/**
      - feat/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compile, test and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run unit tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Generate SHA-256
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256
      - name: Publish test artifact
        uses: actions/upload-artifact@v4
        with:
          name: eden-comms-m0-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
