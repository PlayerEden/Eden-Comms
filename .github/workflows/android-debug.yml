name: Android debug checks
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile, test and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run unit tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug "-PedenSourceRevision=$GITHUB_SHA"
      - name: Smoke-test internal APK re-signing with a disposable CI-only key
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/disposable-ci-keystore.jks" \
            -alias disposable-ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Disposable Signing Test" \
            -storepass CI_DISPOSABLE_TEST_ONLY \
            -keypass CI_DISPOSABLE_TEST_ONLY >/dev/null 2>&1
          export EC_INTERNAL_KEYSTORE_BASE64
          EC_INTERNAL_KEYSTORE_BASE64="$(base64 -w0 "$RUNNER_TEMP/disposable-ci-keystore.jks")"
          export EC_INTERNAL_KEYSTORE_PASSWORD="CI_DISPOSABLE_TEST_ONLY"
          export EC_INTERNAL_KEY_ALIAS="disposable-ci"
          export EC_INTERNAL_KEY_PASSWORD="CI_DISPOSABLE_TEST_ONLY"
          bash scripts/sign_internal_test_apk.sh \
            app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/eden-ci-signing-smoke.apk"
          python3 scripts/audit_apk_identity.py \
            --apk "$RUNNER_TEMP/eden-ci-signing-smoke.apk" \
            --output-dir "$RUNNER_TEMP/eden-ci-signing-smoke-evidence" >/dev/null
          rm -f "$RUNNER_TEMP/disposable-ci-keystore.jks" "$RUNNER_TEMP/eden-ci-signing-smoke.apk"
      - name: Enforce review-only security boundary
        run: bash scripts/check_security_review_boundary.sh
      - name: Audit M1 preparation permissions
        run: bash scripts/check_preview_permissions.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Test Google Play launch-surface inventory
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Audit packaged APK privacy/dependency surface
        run: python3 scripts/audit_play_surface.py --apk app/build/outputs/apk/debug/app-debug.apk --output-dir app/build/play-evidence
      - name: Capture resolved release runtime dependencies
        run: gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > app/build/play-evidence/releaseRuntimeClasspath.txt
      - name: Verify APK package, version and signer evidence
        run: python3 scripts/audit_apk_identity.py --apk app/build/outputs/apk/debug/app-debug.apk --output-dir app/build/play-evidence
      - name: Generate SHA-256
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256
      - name: Publish test artifact
        uses: actions/upload-artifact@v4
        with:
          name: eden-comms-security-prep-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/play-evidence/launch-surface.json
            app/build/play-evidence/launch-surface.md
            app/build/play-evidence/apk-identity.json
            app/build/play-evidence/apk-identity.md
            app/build/play-evidence/releaseRuntimeClasspath.txt
          if-no-files-found: error
          retention-days: 3
